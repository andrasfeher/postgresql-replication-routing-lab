name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Create placeholder secrets for Compose validation
        run: |
          printf '%s\n' 'ci-placeholder' > secrets/postgres_password.txt
          printf '%s\n' 'ci-placeholder' > secrets/replication_password.txt
          printf '%s\n' 'ci-placeholder' > secrets/webapp_password.txt
          ./scripts/init-secrets.sh

      - name: ShellCheck
        run: shellcheck scripts/*.sh pgbouncer/entrypoint.sh

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate HAProxy configuration
        run: |
          # Syntax validation runs outside pgnet; no backend connections are made.
          docker run --rm \
            --add-host pg-node1:127.0.0.1 \
            --add-host pg-node2:127.0.0.1 \
            --add-host pg-node3:127.0.0.1 \
            -v "$PWD/secrets/patroni-tls/ca.crt:/run/secrets/patroni_ca:ro" \
            -v "$PWD/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Validate NGINX configuration
        run: ./scripts/check-nginx.sh

      - name: Build PostgreSQL image
        run: docker compose build pg-node1 etcd-bootstrap
