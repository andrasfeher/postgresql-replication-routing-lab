name: postgres-cluster-lab

services:
  pg-node1:
    build:
      context: .
      args:
        PG_MAJOR: "18"
    container_name: pg-node1
    hostname: pg-node1
    entrypoint: ["/usr/local/bin/node1-entrypoint.sh"]
    secrets:
      - postgres_password
      - replication_password
    volumes:
      - pg_node1_data:/var/lib/postgresql
      - pg_node1_config:/etc/postgresql
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pg-node2:
    build:
      context: .
      args:
        PG_MAJOR: "18"
    container_name: pg-node2
    hostname: pg-node2
    entrypoint: ["/usr/local/bin/node2-entrypoint.sh"]
    depends_on:
      pg-node1:
        condition: service_healthy
    secrets:
      - replication_password
    volumes:
      - pg_node2_data:/var/lib/postgresql
      - pg_node2_config:/etc/postgresql
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- psql -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pg-node3:
    build:
      context: .
      args:
        PG_MAJOR: "18"
    container_name: pg-node3
    hostname: pg-node3
    entrypoint: ["/usr/local/bin/node3-entrypoint.sh"]
    depends_on:
      pg-node1:
        condition: service_healthy
    secrets:
      - replication_password
    volumes:
      - pg_node3_data:/var/lib/postgresql
      - pg_node3_config:/etc/postgresql
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- psql -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  haproxy:
    image: haproxy:3.2-alpine
    container_name: haproxy
    hostname: haproxy
    depends_on:
      pg-node1:
        condition: service_healthy
      pg-node2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:8404:8404"
    networks:
      - pgnet
    restart: unless-stopped

  pgbouncer-1:
    image: ghcr.io/icoretech/pgbouncer-docker:1.25.2
    container_name: pgbouncer-1
    hostname: pgbouncer-1
    depends_on:
      haproxy:
        condition: service_started
    entrypoint: ["/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - ./pgbouncer/pgbouncer-1.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:6432"
    networks:
      - pgnet
    restart: unless-stopped

  pgbouncer-2:
    image: ghcr.io/icoretech/pgbouncer-docker:1.25.2
    container_name: pgbouncer-2
    hostname: pgbouncer-2
    depends_on:
      haproxy:
        condition: service_started
    entrypoint: ["/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - ./pgbouncer/pgbouncer-2.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5433:6432"
    networks:
      - pgnet
    restart: unless-stopped

  pgbouncer-3:
    image: ghcr.io/icoretech/pgbouncer-docker:1.25.2
    container_name: pgbouncer-3
    hostname: pgbouncer-3
    depends_on:
      haproxy:
        condition: service_started
    entrypoint: ["/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - ./pgbouncer/pgbouncer-3.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5434:6432"
    networks:
      - pgnet
    restart: unless-stopped


networks:
  pgnet:
    driver: bridge

volumes:
  pg_node1_data:
  pg_node1_config:
  pg_node2_data:
  pg_node2_config:
  pg_node3_data:
  pg_node3_config:  

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  replication_password:
    file: ./secrets/replication_password.txt
