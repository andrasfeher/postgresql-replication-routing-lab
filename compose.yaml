name: postgres-cluster-lab

services:
  pg-primary:
    build:
      context: .
      args:
        PG_MAJOR: "18"
    container_name: pg-primary
    hostname: pg-primary
    entrypoint: ["/usr/local/bin/primary-entrypoint.sh"]
    secrets:
      - postgres_password
      - replication_password
    volumes:
      - pg_primary_data:/var/lib/postgresql
      - pg_primary_config:/etc/postgresql
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pg-secondary:
    build:
      context: .
      args:
        PG_MAJOR: "18"
    container_name: pg-secondary
    hostname: pg-secondary
    entrypoint: ["/usr/local/bin/secondary-entrypoint.sh"]
    depends_on:
      pg-primary:
        condition: service_healthy
    secrets:
      - replication_password
    volumes:
      - pg_secondary_data:/var/lib/postgresql
      - pg_secondary_config:/etc/postgresql
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- psql -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  haproxy:
    image: haproxy:3.2-alpine
    container_name: haproxy
    hostname: haproxy
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-secondary:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:8404:8404"
    networks:
      - pgnet
    restart: unless-stopped

  pgbouncer-rw:
    image: ghcr.io/icoretech/pgbouncer-docker:1.25.2
    container_name: pgbouncer-rw
    hostname: pgbouncer-rw
    depends_on:
      haproxy:
        condition: service_started
    entrypoint: ["/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - ./pgbouncer/pgbouncer-rw.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:6432"
    networks:
      - pgnet
    restart: unless-stopped

  pgbouncer-ro:
    image: ghcr.io/icoretech/pgbouncer-docker:1.25.2
    container_name: pgbouncer-ro
    hostname: pgbouncer-ro
    depends_on:
      haproxy:
        condition: service_started
    entrypoint: ["/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - ./pgbouncer/pgbouncer-ro.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5433:6432"
    networks:
      - pgnet
    restart: unless-stopped

networks:
  pgnet:
    driver: bridge

volumes:
  pg_primary_data:
  pg_primary_config:
  pg_secondary_data:
  pg_secondary_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  replication_password:
    file: ./secrets/replication_password.txt
