global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    option log-health-checks

    timeout connect 5s
    timeout client 1m
    timeout server 1m
    timeout check 5s


# ============================================================
# READ / WRITE
# ============================================================

frontend postgres_write
    bind *:5432
    default_backend postgres_primary


backend postgres_primary
    mode tcp

    # Patroni returns HTTP 200 only for the current primary.
    option httpchk GET /primary
    http-check expect status 200

    # PostgreSQL traffic goes to :5432.
    # Health checks go to Patroni REST API :8008.
    server pg-node1 pg-node1:5432 check port 8008 inter 2s fall 3 rise 2
    server pg-node2 pg-node2:5432 check port 8008 inter 2s fall 3 rise 2
    server pg-node3 pg-node3:5432 check port 8008 inter 2s fall 3 rise 2


# ============================================================
# READ ONLY
# ============================================================

frontend postgres_read
    bind *:5433
    default_backend postgres_replicas


backend postgres_replicas
    mode tcp
    balance leastconn

    # Patroni returns HTTP 200 only when the member is a replica.
    option httpchk GET /replica
    http-check expect status 200

    server pg-node1 pg-node1:5432 check port 8008 inter 2s fall 3 rise 2
    server pg-node2 pg-node2:5432 check port 8008 inter 2s fall 3 rise 2
    server pg-node3 pg-node3:5432 check port 8008 inter 2s fall 3 rise 2


# ============================================================
# HAProxy statistics
# ============================================================

listen stats
    bind *:8404
    mode http

    stats enable
    stats uri /stats
    stats refresh 5s
