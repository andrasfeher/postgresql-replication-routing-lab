global
    log stdout format raw local0
    maxconn 4096

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    log global
    mode tcp
    option tcplog
    option log-health-checks

    timeout connect 5s
    timeout client 1m
    timeout server 1m
    timeout check 5s


# ============================================================
# READ / WRITE
# ============================================================

frontend postgres_write
    bind *:5432
    default_backend postgres_primary


backend postgres_primary
    mode tcp

    # Patroni returns HTTP 200 only for the current primary.
    option httpchk GET /primary
    http-check expect status 200

    # PostgreSQL traffic goes to :5432.
    # Health checks go to Patroni REST API :8008.
    server pg-node1 pg-node1:5432 check addr 172.30.80.11 port 8008 check-ssl check-sni pg-node1-mgmt verify required verifyhost pg-node1-mgmt ca-file /run/secrets/patroni_ca inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server pg-node2 pg-node2:5432 check addr 172.30.80.12 port 8008 check-ssl check-sni pg-node2-mgmt verify required verifyhost pg-node2-mgmt ca-file /run/secrets/patroni_ca inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server pg-node3 pg-node3:5432 check addr 172.30.80.13 port 8008 check-ssl check-sni pg-node3-mgmt verify required verifyhost pg-node3-mgmt ca-file /run/secrets/patroni_ca inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none


# ============================================================
# READ ONLY
# ============================================================

frontend postgres_read
    bind *:5433
    default_backend postgres_replicas


backend postgres_replicas
    mode tcp
    balance leastconn

    # Patroni returns HTTP 200 only when the member is a replica.
    option httpchk GET /replica
    http-check expect status 200

    server pg-node1 pg-node1:5432 check addr 172.30.80.11 port 8008 check-ssl check-sni pg-node1-mgmt verify required verifyhost pg-node1-mgmt ca-file /run/secrets/patroni_ca inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server pg-node2 pg-node2:5432 check addr 172.30.80.12 port 8008 check-ssl check-sni pg-node2-mgmt verify required verifyhost pg-node2-mgmt ca-file /run/secrets/patroni_ca inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server pg-node3 pg-node3:5432 check addr 172.30.80.13 port 8008 check-ssl check-sni pg-node3-mgmt verify required verifyhost pg-node3-mgmt ca-file /run/secrets/patroni_ca inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none


# ============================================================
# HAProxy statistics
# ============================================================

listen stats
    bind *:8404
    mode http

    stats enable
    stats uri /stats
    stats refresh 5s
