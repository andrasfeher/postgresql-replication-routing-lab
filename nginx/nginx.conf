worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 15s;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Query strings can contain email-verification tokens.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=requests:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:1m;
    limit_conn_zone $server_name zone=total:1m;
    limit_req_status 429;
    limit_conn_status 429;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream application {
        zone application 64k;
        server web:8080 resolve max_conns=64;
    }

    server {
        listen 8080;
        server_name _;
        limit_req zone=requests burst=40 nodelay;
        limit_conn per_ip 20;
        limit_conn total 64;

        location / {
            include /etc/nginx/proxy.conf;
        }
        location = /verify {
            # NGINX error messages may include the original query string.
            error_log /dev/null;
            include /etc/nginx/proxy.conf;
        }
    }
}
