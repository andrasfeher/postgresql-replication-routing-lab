; =====================================================================
; PgBouncer configuration - READ-ONLY endpoint
; =====================================================================
;
; Connection path:
;
;   Application
;       |
;       | localhost:5433
;       v
;   PgBouncer RO :6432
;       |
;       | Docker network
;       v
;   HAProxy :5433
;       |
;       v
;   PostgreSQL SECONDARY :5432
;
; =====================================================================


; =====================================================================
; DATABASE DEFINITIONS
; =====================================================================

[databases]


; Client connection:
;
;   psql -h localhost -p 5433 -U postgres -d postgres
;
; Docker forwards host port 5433 to this PgBouncer instance's
; internal port 6432.
;
; PgBouncer then connects to:
;
;   haproxy:5433
;
; HAProxy port 5433 is our READ-ONLY frontend.
;
; HAProxy routes this connection to:
;
;   pg-secondary:5432
;
* = host=haproxy port=5433



; =====================================================================
; PGBOUNCER SETTINGS
; =====================================================================

[pgbouncer]


; ---------------------------------------------------------------------
; NETWORK LISTENER
; ---------------------------------------------------------------------


; Listen on every IPv4 interface inside the container.
;
listen_addr = 0.0.0.0


; PgBouncer's internal listening port.
;
; Compose maps:
;
;   host :5433
;       ↓
;   pgbouncer-ro :6432
;
listen_port = 6432



; ---------------------------------------------------------------------
; AUTHENTICATION
; ---------------------------------------------------------------------


; Require SCRAM-SHA-256 authentication from clients.
;
auth_type = scram-sha-256


; File containing PgBouncer authentication information.
;
; Both RW and RO PgBouncer containers can use the same userlist.
;
auth_file = /etc/pgbouncer/userlist.txt



; ---------------------------------------------------------------------
; POOLING MODE
; ---------------------------------------------------------------------


; Return the PostgreSQL/HAProxy backend connection to the pool when
; the transaction finishes.
;
; This allows a relatively small number of backend connections to
; service a much larger number of client connections.
;
pool_mode = transaction



; ---------------------------------------------------------------------
; CONNECTION LIMITS / POOL SIZE
; ---------------------------------------------------------------------


; Maximum number of simultaneous client connections accepted by this
; PgBouncer instance.
;
max_client_conn = 200


; Default maximum number of backend connections per user/database pool.
;
; With multiple standby PostgreSQL servers behind HAProxy in the
; future, HAProxy could distribute these backend connections among
; those replicas.
;
default_pool_size = 20



; ---------------------------------------------------------------------
; BACKEND CONNECTION HANDLING
; ---------------------------------------------------------------------


; Maximum time allowed when establishing a connection to HAProxy.
;
server_connect_timeout = 5


; Delay before retrying a failed backend login.
;
server_login_retry = 3



; ---------------------------------------------------------------------
; POSTGRESQL STARTUP PARAMETERS
; ---------------------------------------------------------------------


; Accept clients that supply extra_float_digits as a startup parameter.
;
ignore_startup_parameters = extra_float_digits



; ---------------------------------------------------------------------
; ADMINISTRATION / MONITORING
; ---------------------------------------------------------------------


; Allow postgres to administer this PgBouncer instance through the
; special "pgbouncer" virtual database.
;
admin_users = postgres


; Allow postgres to query PgBouncer statistics.
;
stats_users = postgres



; ---------------------------------------------------------------------
; LOGGING
; ---------------------------------------------------------------------


; Log client connections.
;
log_connections = 1


; Log client disconnects.
;
log_disconnections = 1


; Log pool-related errors.
;
log_pooler_errors = 1