; =====================================================================
; PgBouncer configuration - READ/WRITE endpoint
; =====================================================================
;
; Connection path:
;
;   Application
;       |
;       | localhost:5432
;       v
;   PgBouncer RW :6432
;       |
;       | Docker network
;       v
;   HAProxy :5432
;       |
;       v
;   PostgreSQL PRIMARY :5432
;
; PgBouncer uses semicolon (;) for comments in configuration files.
; =====================================================================


; =====================================================================
; DATABASE DEFINITIONS
; =====================================================================
;
; The [databases] section maps the database name requested by a client
; to an actual PostgreSQL destination.
;
; General syntax:
;
;   client_database = host=<host> port=<port> dbname=<database>
;
[databases]


; When a client connects with:
;
;   psql -h localhost -p 5432 -U postgres -d postgres
;
; it asks PgBouncer for the database named "postgres".
;
; PgBouncer opens backend connections to:
;
;   haproxy:5432
;
; "haproxy" is resolved by Docker's internal DNS because PgBouncer and
; HAProxy are attached to the same pgnet Docker network.
;
; HAProxy port 5432 is our READ/WRITE frontend, which currently routes
; connections to pg-primary:5432.
;
* = host=haproxy port=5432



; =====================================================================
; PGBOUNCER SETTINGS
; =====================================================================
;
[pgbouncer]


; ---------------------------------------------------------------------
; NETWORK LISTENER
; ---------------------------------------------------------------------


; IP address/interfaces on which PgBouncer accepts connections.
;
; 0.0.0.0 means:
;
;   listen on all IPv4 interfaces inside the PgBouncer container.
;
; Docker controls external exposure through the Compose ports mapping.
;
listen_addr = 0.0.0.0


; TCP port on which PgBouncer listens INSIDE its container.
;
; 6432 is the conventional/default PgBouncer port.
;
; Our Compose mapping:
;
;   5432:6432
;
; means:
;
;   Docker host :5432
;         |
;         v
;   PgBouncer container :6432
;
listen_port = 6432



; ---------------------------------------------------------------------
; AUTHENTICATION
; ---------------------------------------------------------------------


; Authentication method PgBouncer requires from clients.
;
; SCRAM-SHA-256 is PostgreSQL's modern password authentication
; mechanism and is preferable to MD5 authentication.
;
auth_type = scram-sha-256


; File containing users PgBouncer is allowed to authenticate.
;
; Typical format:
;
;   "postgres" "password-or-SCRAM-verifier"
;
; This file is mounted into the container by Docker Compose.
;
; IMPORTANT:
; Do not commit a userlist containing plaintext passwords to Git.
;
auth_file = /etc/pgbouncer/userlist.txt



; ---------------------------------------------------------------------
; POOLING MODE
; ---------------------------------------------------------------------


; Determines when PgBouncer returns a PostgreSQL server connection
; to the pool.
;
; PgBouncer supports three important modes:
;
;   session
;       One PostgreSQL connection remains assigned to the client for
;       the entire client session.
;
;       Most compatible with normal PostgreSQL behavior, but provides
;       less aggressive connection pooling.
;
;
;   transaction
;       A PostgreSQL connection is assigned to the client only for the
;       duration of a transaction.
;
;       When COMMIT or ROLLBACK completes, the PostgreSQL connection
;       can be reused by another client.
;
;
;   statement
;       A PostgreSQL connection can be returned after every statement.
;
;       This is the most aggressive mode and has significant
;       restrictions.
;
;
; We use transaction pooling because it demonstrates one of the main
; benefits of PgBouncer:
;
;   many client connections
;              |
;              v
;     relatively few PostgreSQL connections
;
; Be aware that session-level PostgreSQL features require special
; consideration with transaction pooling.
;
pool_mode = transaction



; ---------------------------------------------------------------------
; CONNECTION LIMITS / POOL SIZE
; ---------------------------------------------------------------------


; Maximum number of CLIENT connections PgBouncer accepts.
;
; This does NOT mean PgBouncer creates 200 PostgreSQL connections.
;
; One of PgBouncer's main purposes is allowing many client connections
; while maintaining a much smaller backend connection pool.
;
max_client_conn = 200


; Default maximum number of PostgreSQL server connections maintained
; for each user/database pool.
;
; With:
;
;   max_client_conn = 200
;   default_pool_size = 20
;
; PgBouncer might therefore have many client connections while using
; only around 20 backend connections for a particular pool.
;
; The exact number depends on databases, users, reserved pools and
; other configuration.
;
default_pool_size = 20



; ---------------------------------------------------------------------
; BACKEND CONNECTION HANDLING
; ---------------------------------------------------------------------


; Maximum time PgBouncer waits while trying to establish a connection
; to the backend.
;
; Here the backend is HAProxy, not PostgreSQL directly:
;
;   PgBouncer
;       |
;       v
;   HAProxy
;       |
;       v
;   PostgreSQL
;
server_connect_timeout = 5


; If a backend login fails, wait this many seconds before attempting
; another login.
;
; This helps prevent very rapid connection retries when PostgreSQL or
; HAProxy is temporarily unavailable.
;
server_login_retry = 3



; ---------------------------------------------------------------------
; POSTGRESQL STARTUP PARAMETERS
; ---------------------------------------------------------------------


; Some PostgreSQL clients send extra_float_digits as part of the
; startup parameters.
;
; This setting tells PgBouncer not to reject a connection simply
; because the client supplies this parameter.
;
ignore_startup_parameters = extra_float_digits



; ---------------------------------------------------------------------
; ADMINISTRATION / MONITORING
; ---------------------------------------------------------------------


; Users permitted to access PgBouncer's administrative console.
;
; PgBouncer provides a special virtual database:
;
;   pgbouncer
;
; For example:
;
;   psql -h localhost -p 5432 -U postgres -d pgbouncer
;
; Administrative commands include:
;
;   SHOW POOLS;
;   SHOW CLIENTS;
;   SHOW SERVERS;
;   SHOW DATABASES;
;   SHOW CONFIG;
;
admin_users = postgres


; Users allowed to execute PgBouncer statistics commands.
;
; These users have less administrative capability than admin_users
; but can inspect PgBouncer statistics.
;
stats_users = postgres



; ---------------------------------------------------------------------
; LOGGING
; ---------------------------------------------------------------------


; Log new client connections.
;
; Useful while building and troubleshooting the lab.
;
; In a busy production system this can produce significant log volume.
;
log_connections = 1


; Log client disconnects.
;
log_disconnections = 1


; Log errors related to PgBouncer pools.
;
; This is particularly useful for detecting backend connection
; failures and exhausted pools.
;
log_pooler_errors = 1